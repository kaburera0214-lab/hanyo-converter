# =====================================================================
# 【廃止】2026-08-31。auth-keepalive.yml に統合しました。
#
# ■ なぜ
#   このワークフローはNE専用で、Yahooの認可はカバーしていなかった。
#   2026-08-31、価格改定でYahooが "refresh token has expired" で失敗し、
#   延命の対象がNEだけだったことが判明した。
#   接続先を問わない形（batch/auth_keepalive.py）へ作り直した。
#
# ■ 止め方
#   このファイルを .github/workflows/ の外へ移動した。GitHub Actions は
#   .github/workflows/ 直下しか見ないので、この場所にある限り動かない。
#   ファイルは経緯を残すために消していない。
#
# ■ 二重実行について
#   NEのトークンは新しく発行されると旧トークンが即失効するため、
#   新旧が同時に走るとトークンを壊す。新 auth-keepalive.yml は
#   concurrency group を "ne-keepalive"（このファイルと同じ）にしてあるので、
#   万一これを復活させても同時には走らない。
# =====================================================================

name: ne-keepalive-daily

# NEのrefresh_tokenは発行から3日で切れる（access_tokenは1日）。
# 入荷登録は不定期・マスタ同期は週次なので、放置すると必ず認証切れになる。
# 軽いAPIを1日2回呼んでトークンを転がし続ける（1回でも足りるが、実行が飛んでも
# 3日以内に必ず成功するよう余裕をとる）。消費はNE APIの月60回（無料枠1000回）。

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 20:00 UTC = 翌05:00 JST
    - cron: "0 8 * * *"    # 毎日 08:00 UTC =   17:00 JST
  workflow_dispatch: {}     # 手動実行も可（再認可の直後に動作確認する用）

concurrency:
  group: ne-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # libの依存（streamlitはシムで置換するため不要）。
      # pandasは lib/master_store → lib/invoice/csv_import が読むため必須
      # （Drive保存先フォルダIDの解決経路。外すと "No module named 'pandas'" で落ちる）。
      - run: pip install pandas requests google-api-python-client google-auth

      - name: Keep NE tokens alive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NE_CLIENT_ID: ${{ secrets.NE_CLIENT_ID }}
          NE_CLIENT_SECRET: ${{ secrets.NE_CLIENT_SECRET }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python batch/ne_keepalive.py

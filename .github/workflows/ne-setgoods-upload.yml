name: ne-setgoods-upload

# ネクストエンジンのセット商品マスタへ、新しいセットを公式APIで登録する手動バッチ。
# NEは利用規約でAI・自動化ツールによる画面の操作を禁じている（公式APIは対象外）ので、ここから登録する。
#
# 定期実行しない（セット商品を作るときだけ Run workflow で回す）。
# 既定は「確認だけ」。apply にチェックを入れたときだけNEへ送る。
# すでにあるセット商品コードは送らない。送ったあとNEから引き直して中身を確かめ、違えば失敗にする。
#
# このリポジトリは公開。ログに出るのは件数とファイル名だけ。
# 計画CSVと1件ごとの結果は Google ドライブ（非公開）に置く。
#
# concurrency group は auth-keepalive.yml と同じ "ne-keepalive"。
# NEはトークンが再発行されると旧トークンが即失効するため、延命バッチと同時に走らせない。

on:
  workflow_dispatch:
    inputs:
      file:
        description: "計画CSVのファイル名（Googleドライブの商品マスタのフォルダに置いたもの）"
        required: true
      only:
        description: "登録するセット商品コード（カンマ区切り）。空なら計画CSVの全部"
        required: false
        default: ""
      apply:
        description: "NEへ登録する（切ると確認だけ・NEへは何も送らない）"
        type: boolean
        default: false
      daihyo:
        description: "代表商品コードの列を付けて送る"
        type: boolean
        default: true

concurrency:
  group: ne-keepalive
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # auth-keepalive.yml と同じ依存。streamlitはシムで置換するため不要。
      - run: pip install pandas requests google-api-python-client google-auth

      - name: NE setgoods upload
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NE_CLIENT_ID: ${{ secrets.NE_CLIENT_ID }}
          NE_CLIENT_SECRET: ${{ secrets.NE_CLIENT_SECRET }}
          IN_FILE: ${{ inputs.file }}
          IN_ONLY: ${{ inputs.only }}
          IN_APPLY: ${{ inputs.apply }}
          IN_DAIHYO: ${{ inputs.daihyo }}
        run: |
          # 入力は環境変数で受ける（式をコマンドに直接埋め込まない）
          set -- --file "$IN_FILE"
          if [ -n "$IN_ONLY" ]; then set -- "$@" --only "$IN_ONLY"; fi
          if [ "$IN_APPLY" = "true" ]; then set -- "$@" --apply; fi
          if [ "$IN_DAIHYO" != "true" ]; then set -- "$@" --no-daihyo; fi
          python batch/ne_setgoods_upload.py "$@"

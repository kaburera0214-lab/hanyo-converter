name: ne-order-rows

# ネクストエンジンの受注明細（伝票に確定している商品コード）を取り出して、
# Google ドライブへ ne_order_rows_YYYYMMDD_NNN.csv として保存する。
# 原価は「モールで売れたSKU」ではなく「NEの伝票で確定している商品コード」で確定させるため。
# GapBoard（ローカル）が毎朝ドライブから取って取り込む。
#
# このリポジトリは公開。受注データをログに出さない・artifact に上げない。
# 出力先は Google ドライブ（非公開）だけ。ログに出るのは件数とファイル名だけ。
#
# concurrency group は auth-keepalive.yml と同じ "ne-keepalive"。
# NEはトークンが再発行されると旧トークンが即失効するため、延命バッチと同時に走らせない。

# 起動は GapBoard の毎朝の同期（このPC 6:30）が、枝 ne-order-rows-trigger へ合図を push して行う（2026-11-24〜）。
# 時刻指定（cron 5:30）は GitHub の混雑で 9:30〜14:00 に遅れ、6:30 の同期が前日の明細で原価を計算していたため。
# 合図の枝にはこのファイルの写しと日時しか無いので、コードは main から取る（checkout の ref: main）。
on:
  push:
    branches: [ne-order-rows-trigger]
  workflow_dispatch:
    inputs:
      probe:
        description: "項目名の確認だけして終わる（値は出さない）"
        type: boolean
        default: false
      from:
        description: "受注日の開始 (YYYY-MM-DD)。入れると範囲で全部取る（過去分の取り込み用）"
        required: false
        default: ""
      to:
        description: "受注日の終了 (YYYY-MM-DD)。空なら今日"
        required: false
        default: ""
      days:
        description: "開始日が空のとき、直近この日数に更新のあった伝票を取る"
        required: false
        default: "4"
      prefix:
        description: "保存名の頭。分析用の過去分は ne_row_history（GapBoardの取り込みに混ぜない）"
        type: choice
        options: [ne_order_rows, ne_row_history]
        default: ne_order_rows

concurrency:
  group: ne-keepalive
  queue: max                # 待ちを捨てず先着順に実行（既定は1件で、古い待ちが取り消される）
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # auth-keepalive.yml と同じ依存。streamlitはシムで置換するため不要。
      - run: pip install pandas requests google-api-python-client google-auth

      - name: NE order rows
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NE_CLIENT_ID: ${{ secrets.NE_CLIENT_ID }}
          NE_CLIENT_SECRET: ${{ secrets.NE_CLIENT_SECRET }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          IN_PROBE: ${{ inputs.probe }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_DAYS: ${{ inputs.days }}
          IN_PREFIX: ${{ inputs.prefix }}
        run: |
          # 入力は環境変数で受ける（式をコマンドに直接埋め込まない）
          ARGS=""
          if [ "$IN_PROBE" = "true" ]; then
            ARGS="--probe"
          elif [ -n "$IN_FROM" ]; then
            ARGS="--from $IN_FROM"
            if [ -n "$IN_TO" ]; then ARGS="$ARGS --to $IN_TO"; fi
          else
            ARGS="--days ${IN_DAYS:-4}"
          fi
          python batch/ne_order_rows.py $ARGS --prefix "${IN_PREFIX:-ne_order_rows}"

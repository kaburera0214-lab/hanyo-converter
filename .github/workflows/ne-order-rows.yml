name: ne-order-rows

# ネクストエンジンの受注明細（伝票に確定している商品コード）を取り出す。
# 原価は「モールで売れたSKU」ではなく「NEの伝票で確定している商品コード」で確定させるため。
#
# このリポジトリは公開。受注データをログに出さない・artifact に上げない。
# 出力先は Google ドライブ（非公開）だけ。--probe が出すのは項目名だけ。
#
# concurrency group は auth-keepalive.yml と同じ "ne-keepalive"。
# NEはトークンが再発行されると旧トークンが即失効するため、延命バッチと同時に走らせない。

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "項目名の確認だけして終わる（API 1回・値は出さない）"
        type: boolean
        default: true

concurrency:
  group: ne-keepalive
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # auth-keepalive.yml と同じ依存。streamlitはシムで置換するため不要。
      - run: pip install pandas requests google-api-python-client google-auth

      - name: NE order rows
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NE_CLIENT_ID: ${{ secrets.NE_CLIENT_ID }}
          NE_CLIENT_SECRET: ${{ secrets.NE_CLIENT_SECRET }}
        run: |
          python batch/ne_order_rows.py ${{ inputs.probe && '--probe' || '' }}

name: weekend-ship-ne

# 土日祝出荷（AIworkspace\weekend-shipping）の NE API 担当。
# 本命の起動は weekend-ship-trigger.yml（PC が合図を push）。こちらは GitHub の混雑で数時間遅れることがある。
# PC が共通の置き場（Supabase）に暗号化して置いた指示を待ち受けて NE API を呼び、結果をドライブに返す。
# 出荷日の一覧（共通の置き場 weekend_ship_calendar）に今日が無ければすぐ終わる。
#
# このリポジトリは公開。受注の中身はログにも artifact にも出さない（ドライブだけ）。
# concurrency group は auth-keepalive.yml と同じ "ne-keepalive"（NEのトークンを同時に回さない）。

on:
  # 時刻指定の起動（毎日 07:40・12:00）は外した（2026-11-19）。土日祝はいつも待ち受ける作りにしたため、
  # 倉庫で「始める」が押されない日にも起動して、指示が来ないまま75分で「PCから指示が来ません」と誤報を出す。
  # 起動は PC が最初の指示を出すときに合図を push する経路（weekend-ship-trigger.yml）だけにする。
  push:                     # 担当の中身を変えたら probe を1回（項目名・発送方法の一覧をドライブへ）
    branches: [main]
    paths:
      - batch/weekend_ship_ne.py
      - .github/workflows/weekend-ship-ne.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "probe=項目と一覧の確認 / serve=待ち受け"
        type: choice
        options: [probe, serve]
        default: probe
      until:
        description: "serve の終了時刻（JST HH:MM）"
        default: "11:30"
      force:
        description: "出荷日の一覧に無くても待ち受ける（試験用）"
        type: boolean
        default: false

concurrency:
  group: ne-keepalive
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas requests google-api-python-client google-auth cryptography

      - name: weekend ship NE
        env:
          SHARED_SECRETS_URL: ${{ secrets.SHARED_SECRETS_URL }}
          SHARED_SECRETS_ANON_KEY: ${{ secrets.SHARED_SECRETS_ANON_KEY }}
          SHARED_SECRETS_KEY: ${{ secrets.SHARED_SECRETS_KEY }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NE_CLIENT_ID: ${{ secrets.NE_CLIENT_ID }}
          NE_CLIENT_SECRET: ${{ secrets.NE_CLIENT_SECRET }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          IN_MODE: ${{ inputs.mode }}
          IN_UNTIL: ${{ inputs.until }}
          IN_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 入力は環境変数で受ける（式をコマンドに直接埋め込まない）
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "40 22 * * *" ]; then UNTIL="11:30"; else UNTIL="18:30"; fi
            python batch/weekend_ship_ne.py --serve --until "$UNTIL"
          elif [ "$EVENT" = "push" ]; then
            python batch/weekend_ship_ne.py --probe
          elif [ "$IN_MODE" = "serve" ]; then
            FORCE=""
            if [ "$IN_FORCE" = "true" ]; then FORCE="--force"; fi
            python batch/weekend_ship_ne.py --serve --until "${IN_UNTIL:-11:30}" $FORCE
          else
            python batch/weekend_ship_ne.py --probe
          fi
